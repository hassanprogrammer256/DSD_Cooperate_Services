name: Deploy to EC2

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Static site: no environment variables or API URL needed — content is bundled.
      - name: Build static site
        run: |
          npm ci
          npm run build

      - name: Upload build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist/*"
          target: "/tmp/client-dist"
          strip_components: 1
          rm: true # clear the previous upload first so removed files don't linger

      - name: Publish to web root
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            sudo mkdir -p /var/www/client
            sudo rm -rf /var/www/client/*
            sudo cp -r /tmp/client-dist/. /var/www/client/
            sudo chown -R www-data:www-data /var/www/client
            rm -rf /tmp/client-dist
