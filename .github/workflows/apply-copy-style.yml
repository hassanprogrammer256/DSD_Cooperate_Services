name: Apply Copy Style Fix to Production

# Deliberately manual-only — no push or schedule trigger. This writes to the
# production database (see content/management/commands/fix_copy_style.py),
# so it only ever runs when someone explicitly clicks "Run workflow".
on:
  workflow_dispatch: {}

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Run fix_copy_style --apply on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/DSD_Cooperate_Services/backend
            source venv/bin/activate
            export DJANGO_SETTINGS_MODULE=config.settings.prod
            python manage.py fix_copy_style --apply
