repos:
  - repo: local
    hooks:
      - id: lint-site
        name: Lint Static Site
        entry: cmd /c 'npm run lint'
        language: system
        files: ^(src/|scripts/)
        pass_filenames: false
        stages: [pre-commit]

      - id: build-site
        name: Build Static Site
        entry: cmd /c 'npm run build'
        language: system
        files: ^(src/|public/|scripts/|index\.html|package(-lock)?\.json|vite\.config\.ts|tsconfig.*\.json)
        pass_filenames: false
        stages: [pre-commit]
